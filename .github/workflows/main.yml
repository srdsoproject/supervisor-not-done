name: Inspection Monitor

on:
  schedule:
    - cron: '30 19 * * *'    # 01:00 IST
    - cron: '30 0 * * *'     # 06:00 IST  
    - cron: '0 5 * * *'      # 10:30 IST
    - cron: '30 9 * * *'     # 15:00 IST
    - cron: '30 13 * * *'    # 19:00 IST

  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install gspread google-auth gspread-formatting

      - name: Create credentials.json
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: List Files (Debug)
        run: ls -la

      - name: Run Inspection Monitor
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: |
          if [ -f "main.py" ]; then
            python main.py
          else
            echo "❌ ERROR: main.py not found in repository root!"
            ls -la
            exit 1
          fi

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspection-logs
          path: |
            *.json
            *.log
