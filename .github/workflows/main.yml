name: Inspection Monitor

on:
  schedule:
    - cron: '30 19 * * *'    # 01:00 IST
    - cron: '30 0 * * *'     # 06:00 IST
    - cron: '0 5 * * *'      # 10:30 IST
    - cron: '30 9 * * *'     # 15:00 IST
    - cron: '30 13 * * *'    # 19:00 IST

  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install gspread google-auth gspread-formatting

      - name: Create credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Run Script
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python monitor_inspections.py
