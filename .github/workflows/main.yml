name: Run Inspection Monitor

on:
  schedule:
    - cron: '0 18 * * *' # Example: Runs everyday at 6 PM UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread google-auth gspread-formatting

    - name: Execute Monitor Script
      # This mapping injects your GitHub Secrets directly into the script execution environment safely
      env:
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        GOOGLE_SHEET1_ID: ${{ secrets.GOOGLE_SHEET1_ID }}
        GOOGLE_SHEET2_ID: ${{ secrets.GOOGLE_SHEET2_ID }}
        GOOGLE_WORKSHEET2_NAME: ${{ secrets.GOOGLE_WORKSHEET2_NAME }}
        # Uncomment below if you decide to hide credentials.json completely:
        # GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      run: python your_script_name.py
